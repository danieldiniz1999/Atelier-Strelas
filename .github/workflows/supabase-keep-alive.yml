name: Supabase daily activity

on:
  schedule:
    # 09:17 America/Fortaleza (UTC-3)
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one category
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Required Supabase secrets are missing."
            exit 1
          fi

          for attempt in 1 2 3 4; do
            status="000"
            if status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              --request GET \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "${SUPABASE_URL%/}/rest/v1/categories?select=id&limit=1"); then
              if [[ "$status" == "200" ]]; then
                echo "Supabase read succeeded (HTTP 200)."
                exit 0
              fi
            fi
            echo "Attempt $attempt/4 failed (HTTP $status)."
            if [[ "$attempt" -lt 4 ]]; then
              sleep 10
            fi
          done

          echo "Supabase read failed after four attempts."
          exit 1
